# Install from scratch and test on other operating systems than the one the results came from.
name: test
on:
  push:
  workflow_dispatch:
jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_demo.py
        env:
          PYTHONUTF8: "1"
      - run: python scripts/paper_values.py --results results --check
        env:
          PYTHONUTF8: "1"
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_all.py --quick --workers 4
        env:
          PYTHONUTF8: "1"
      - if: always()
        run: tail -n 60 work/logs/90_paper_values.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-run
          path: |
            work/logs/
            work/paper_values_comparison.csv
